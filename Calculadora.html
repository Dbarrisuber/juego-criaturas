<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <style>
            body{
                font-family:'Courier New', Courier, monospace;
                background-color:black;
                text-align:center;
                color:white;
            }
            .teclado {
            display: flex;
           flex-wrap:wrap;
            gap: 8px;
            width: 240px;
              margin-left:auto;
              margin-right:auto;
                background-color:rgb(55, 53, 53);
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                padding: 16px;}

                .teclado button {
                flex: 0 0 calc(33.333% - 8px);
                 height: 50px;
                font-size: 20px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                   }
                .teclado button:hover {
                background-color: rgb(100, 100, 100);}
                .igual{
                  width:100%;
                  height:100px;
                  font-size:50px; 
                  text-align:center; 
                }
                
            </style>
    </head>
    <body>
        <h1>Calculadora</h1>
        <div class="teclado">
        <button type="button" class="numero" data-numero="1">1</button>
        <button type="button" class="numero" data-numero="2">2</button>
        <button type="button" class="numero" data-numero="3">3</button>
        <button type="button" class="numero" data-numero="4">4</button>
        <button type="button" class="numero" data-numero="5">5</button>
        <button type="button" class="numero" data-numero="6">6</button>
        <button type="button" class="numero" data-numero="7">7</button>
        <button type="button" class="numero" data-numero="8">8</button>
        <button type="button" class="numero" data-numero="9">9</button>
        <button type="button" class="numero" data-numero="0">0</button>
        <button onclick="sumar()" class="operaciones">+</button>
        <button onclick="restar()" class="operaciones">-</button>
        <button onclick="multiplicar()" class="operaciones">*</button>
        <button onclick="dividir()" class="operaciones">/</button>
        <button onclick="calcular()" class="operaciones">=</button>
        <button onclick="limpiar()" class="operaciones">C</button>
        <input type="text" class="igual" id="resultado" readonly>
        </div>
    </body>
    <script>
        const pantalla=document.getElementById("resultado");
        let primer_numero="";
        let segundo_numero="";
        let operador="";
        document.querySelectorAll(".numero").forEach(boton=>{
            boton.addEventListener("click",function(){
                agregarNumero(boton.dataset.numero)
            })})
        function agregarNumero(numero)
        {pantalla.value+=numero;}
        function sumar()
        {primer_numero=pantalla.value;
        operador="+";
        pantalla.value="";
        segundo_numero="";}
        function restar(){
            primer_numero=pantalla.value;
            operador="-";
            pantalla.value="";
            segundo_numero="";}
        function multiplicar(){
            primer_numero=pantalla.value;
            operador="*";
            pantalla.value="";
            segundo_numero="";}
        function dividir(){
            primer_numero=pantalla.value;
            operador="/";
            pantalla.value="";
            segundo_numero="";
        }
        function calcular()
        {if(operador==="+"){segundo_numero=pantalla.value;
            primer_numero=Number(primer_numero);
            segundo_numero=Number(segundo_numero);
            let resultado=primer_numero+segundo_numero;
            pantalla.value=resultado;
        }else if(operador==="-")
          {segundo_numero=pantalla.value;
            primer_numero=Number(primer_numero);
            segundo_numero=Number(segundo_numero);
            let resultado=primer_numero-segundo_numero;
            pantalla.value=resultado;
        }else if(operador==="*")
        {segundo_numero=pantalla.value;
        primer_numero=Number(primer_numero);
        segundo_numero=Number(segundo_numero);
        let resultado=primer_numero*segundo_numero;
        pantalla.value=resultado;
    }else if(operador==="/")
        {segundo_numero=pantalla.value;
        primer_numero=Number(primer_numero);
        segundo_numero=Number(segundo_numero);
        let resultado=primer_numero/segundo_numero;
        if(segundo_numero===0){
            pantalla.value="Error";}
        }else{
        pantalla.value=resultado;
    }}
    function limpiar()
    {pantalla.value="";
    primer_numero="";
    segundo_numero="";
    operador="";}

</script>
</html>
