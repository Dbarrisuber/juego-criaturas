<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Alineador de fútbol</title>
        <style>
            body{background-color: rgb(67, 230, 61);font-family:Arial, sans-serif;text-align:center;}
            .titulo{background-color:rgb(54, 136, 47);border:20px;padding:50px;margin:200px;border-radius:10px;margin-left:600px;margin-right:600px;box-shadow:0px 4px 16px rgba(51, 50, 50, 0.5)}
            #titulo1{font-size:50px;color:rgb(78, 255, 78);}
            #alinear{background-color: green;color:rgb(55, 243, 55);border:20px;padding:10px;border-radius:10px;cursor:pointer;font-size:30px;}
            #alinear:hover{color:rgb(66, 141, 66)}
            .terreno{background-color:rgb(64, 122, 64);border:5px solid white;border-radius:10px;display:flex;flex-direction:column-reverse;padding:100px;}
            .linea-blanca{background-color:rgb(255, 255, 255);position:absolute;top:570px;height:5px;border:10px;width:594px;margin-left:-100px;}
            .carta-jugador{border:5px solid rgb(44, 230, 44);border-radius:10px;background-color: rgb(255, 255, 255);color:rgb(0,0,0);padding:20px;}
            #Portero{display:flex;justify-content: center;gap:10px;}
            #Defensa{display:flex;justify-content: center;gap:10px;}
            #Centrocampista{display:flex;justify-content: center;gap:10px;}
            #Delantero{display:flex;justify-content: center;gap:10px;}
            #borrar{background-color: green;color:rgb(55, 243, 55);border:20px;padding:10px;border-radius:10px;cursor:pointer;font-size:30px;}
            #borrar:hover{color:rgb(66, 141, 66)}
        </style>
    </head>
    <body>
        <div class="titulo">
            <h1 id="titulo1">ALINEADOR</h1>
        <div class="jugador">
            <input id="jugador" placeholder="Vini Jr">
        </div>
        <div class="posiciones">
            <select id="posicion">
                <option>Portero</option>
                <option>Defensa</option>
                <option>Centrocampista</option>
                <option>Delantero</option>
            </select>
        </div>
        <div>
            <button id="alinear" onclick="alinearJugador()">Alinear</button>
            <button id="borrar" onclick="borrado()">Borrar</button>
        </div>
        <div class="terreno" id="campo">
            <div class="linea-blanca"></div>
            <div id="Portero"></div>
            <div id="Defensa"></div>
            <div id="Centrocampista"></div>
            <div id="Delantero"></div>
        </div>
    </div>
 </body>
    <script>
        function alinearJugador()
        {let jugador=document.getElementById("jugador").value;
        let posicion=document.getElementById("posicion").value;
        if(jugador==="")
        {alert("Escribe un jugador");
        return;}
        else{
        let carta=document.createElement("div")
        carta.className="carta-jugador"
        carta.textContent=jugador
        document.getElementById(posicion).appendChild(carta)
        }}
        function borrado()
        {let posiciones=["Portero","Defensa","Centrocampista","Delantero"]
        for(let i=0;i<posiciones.length;i++)
        {document.getElementById(posiciones[i]).textContent=""}
        }
    </script>
</html>
