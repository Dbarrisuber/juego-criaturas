<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: #520c0c;
                text-align: center;
            }
            h1{
                background-color: rgb(109, 30, 30);
                color: white;
                padding: 10px;
                border-radius: 5px;
                margin-top: 20px;
                margin-bottom: 20px;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                font-size: 50px;

            }
            .boton-borrar{
                background-color: red;
                color: white;
                border: none;
                padding: 5px 10px;
                margin-left: 10px;
                cursor: pointer;
                border-radius: 3px;
            }
            .boton-borrar:hover{
                background-color: darkred;
            }
            #tarea{
                background-color: rgb(222, 74, 15);
                padding: 10px;
                margin: 5px 0;
                border-radius: 5px;
                color: white;
                font-size: 20px;
            }
            #campo_de_tareas{
                margin-top: 20px;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                padding: 10px;
                background-color: #b31919;
                border-radius: 5px;}



        </style>
    </head>
    <body>
        <h1>Mis Tareas</h1>
        <input type="text" id="nombre">
        <button onclick="agregarTarea()">Agregar</button>
        <div id="campo_de_tareas">
            <ul id="tareas"></ul>
        </div>
    </body>
    <script>
        function agregarTarea(){
        let nombre=document.getElementById("nombre").value
        if(nombre===""){
        alert("Escribe una tarea");
        }else
        {let tarea=document.createElement("li");
        tarea.id="tarea"
        tarea.textContent=nombre;
        let borrar=document.createElement("button")
        borrar.className="boton-borrar"
        borrar.textContent="Borrar"
        borrar.onclick=function(){
        tarea.remove()}
        tarea.appendChild(borrar)
        let selectorEstado=document.createElement("select")
        let completado=document.createElement("option")
        let pendiente=document.createElement("option")
        completado.textContent="Completado"
        pendiente.textContent="Pendiente"
        selectorEstado.appendChild(pendiente)
        selectorEstado.appendChild(completado)
        tarea.appendChild(selectorEstado)
        document.getElementById("tareas").appendChild(tarea)
        }
    }
    </script>
</html>
